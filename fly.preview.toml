app = "instaclean-mithril-preview"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_HOST = "instaclean-mithril-preview.fly.dev"
  PORT = "4000"
  POOL_SIZE = "5"
  DATABASE_BACKEND = "fly"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/ready"
    protocol = "http"
    timeout = "3s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
