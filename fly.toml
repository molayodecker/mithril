app = "instaclean-mithril"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_HOST = "api.tryinstaclean.com"
  OPEN_API_DOCS_HOST = "openapi.tryinstaclean.com"
  # PostHog project 514495. The project API key is a secret. Stripe stays off there.
  PORT = "4000"
  POOL_SIZE = "5"
  DATABASE_BACKEND = "fly"
  SUMSUB_WORKER_LEVEL_NAME = "id-and-liveness"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/ready"
    protocol = "http"
    timeout = "3s"

[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
