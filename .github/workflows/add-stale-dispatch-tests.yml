name: Add stale dispatch regression tests

on:
  push:
    branches:
      - fix/direct-dispatch-availability
    paths:
      - .github/workflows/add-stale-dispatch-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-dispatch-availability
      - name: Add regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/mithril/direct_dispatch_safety_test.exs')
          s = p.read_text()
          marker = '  test "delegates assignment when the worker is eligible and schedule-safe" do\n'
          tests = '''  test "rejects assignment when a queued request start has gone stale" do
    %{admin_id: admin_id, worker_id: worker_id, request_id: request_id} = dispatch_fixture!()

    Repo.query!(
      "UPDATE public.direct_service_requests SET requested_start_at = now() - interval '5 minutes' WHERE id = $1",
      [Ecto.UUID.dump!(request_id)]
    )

    assert {:error, :needed_by_past} =
             DirectDispatchSafety.assign_admin_service_request(admin_id, request_id, %{
               "workerUserId" => worker_id
             })
  end

  test "admin assignment can move a stale request to a new future time" do
    %{admin_id: admin_id, worker_id: worker_id, request_id: request_id} = dispatch_fixture!()
    future = DateTime.utc_now() |> DateTime.add(21_600, :second) |> DateTime.truncate(:second)

    Repo.query!(
      "UPDATE public.direct_service_requests SET requested_start_at = now() - interval '5 minutes' WHERE id = $1",
      [Ecto.UUID.dump!(request_id)]
    )

    assert {:ok, assigned} =
             DirectDispatchSafety.assign_admin_service_request(admin_id, request_id, %{
               "workerUserId" => worker_id,
               "neededBy" => DateTime.to_iso8601(future)
             })

    assert assigned.status == "assigned"

    [[stored]] =
      Repo.query!(
        "SELECT requested_start_at FROM public.direct_service_requests WHERE id = $1",
        [Ecto.UUID.dump!(request_id)]
      ).rows

    assert DateTime.compare(stored, future) == :eq
  end

'''
          if 'rejects assignment when a queued request start has gone stale' not in s:
              if marker not in s:
                  raise SystemExit('test insertion marker not found')
              p.write_text(s.replace(marker, tests + marker, 1))
          PY
      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/mithril/direct_dispatch_safety_test.exs
          git commit -m "test: cover stale dispatch assignment timing"
          git push origin HEAD:fix/direct-dispatch-availability
