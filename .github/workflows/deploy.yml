name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options:
          - staging
          - production
        default: staging
      commit_sha:
        description: Commit to deploy. A 40-character SHA, vX.Y.Z, or staging/<sha>. For production, supply this or version.
        required: false
        type: string
      version:
        description: Release or tag to deploy, such as v0.1.4 or staging/<sha>. For production, supply this or commit_sha.
        required: false
        type: string

# Staging finalization may write tags, but every deploy caller explicitly uses read-only contents.
permissions:
  contents: write
  actions: read
  statuses: write

jobs:
  staging_after_ci:
    # Every successful CI run for a push to main deploys that exact commit
    # to staging. Pull-request CI never deploys.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: staging
      fly_app: instaclean-mithril-staging
      fly_config: fly.staging.toml
      ready_url: https://instaclean-mithril-staging.fly.dev/ready
      openapi_url: https://instaclean-mithril-staging.fly.dev/openapi.json
      checkout_ref: ${{ github.event.workflow_run.head_sha }}
      confirm_ci: false
      require_staging_status: false
      mark_staging_status: true
      apply_auth_schema: true
    secrets: inherit

  resolve_dispatch:
    # Manual deploys name a commit, a release, or an immutable staging tag.
    # The resolved commit is what the environment jobs check out.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version or tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: bash scripts/resolve_deploy_ref.sh

  staging_manual:
    # Manual staging deploys are allowed from main. If no target is given,
    # deploy the main commit from which the workflow was dispatched.
    needs: resolve_dispatch
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.environment == 'staging'
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: staging
      fly_app: instaclean-mithril-staging
      fly_config: fly.staging.toml
      ready_url: https://instaclean-mithril-staging.fly.dev/ready
      openapi_url: https://instaclean-mithril-staging.fly.dev/openapi.json
      checkout_ref: ${{ needs.resolve_dispatch.outputs.sha }}
      confirm_ci: true
      require_staging_status: false
      mark_staging_status: true
      apply_auth_schema: true
    secrets: inherit

  production:
    # Production is an explicit promotion of a commit that already passed
    # staging. The operator names that commit, its vX.Y.Z release, or its
    # staging/<sha> tag. The tag is resolved before the staging check.
    needs: resolve_dispatch
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.environment == 'production'
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: production
      fly_app: instaclean-mithril
      fly_config: fly.toml
      ready_url: https://api.tryinstaclean.com/ready
      openapi_url: https://api.tryinstaclean.com/openapi.json
      checkout_ref: ${{ needs.resolve_dispatch.outputs.sha }}
      confirm_ci: true
      require_staging_status: true
      mark_staging_status: false
      apply_auth_schema: false
    secrets: inherit

  finalize_staging_after_ci:
    needs: staging_after_ci
    if: ${{ needs.staging_after_ci.result == 'success' }}
    permissions:
      contents: write
      statuses: write
    uses: ./.github/workflows/finalize-staging.yml
    with:
      checkout_ref: ${{ needs.staging_after_ci.outputs.deploy_sha }}

  finalize_staging_manual:
    needs: staging_manual
    if: ${{ needs.staging_manual.result == 'success' }}
    permissions:
      contents: write
      statuses: write
    uses: ./.github/workflows/finalize-staging.yml
    with:
      checkout_ref: ${{ needs.staging_manual.outputs.deploy_sha }}

  record_production:
    needs: production
    if: ${{ needs.production.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point env/production at the promoted commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/move_env_tag.sh env/production "${{ needs.production.outputs.deploy_sha }}"
