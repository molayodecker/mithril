name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read
  actions: read

jobs:
  staging:
    # PRs never deploy. A successful CI run on a push to this
    # repository's main branch deploys staging. Manual dispatch of
    # main can deploy staging too.
    if: >-
      (
        github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main'
        && github.event.inputs.environment == 'staging'
      )
      || (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
      )
    environment: staging
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: staging
      fly_app: instaclean-mithril-staging
      fly_config: fly.staging.toml
      fly_org: personal
      fly_mpg_name: instaclean-mithril-staging-pg
      ready_url: https://instaclean-mithril-staging.fly.dev/ready
      openapi_url: https://instaclean-mithril-staging.fly.dev/openapi.json
      checkout_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      confirm_ci: ${{ github.event_name == 'workflow_dispatch' }}
      apply_auth_schema: true
    secrets: inherit

  production:
    # Production never deploys from a pull request or from automatic
    # main CI. Promote with workflow_dispatch on main after staging.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && github.event.inputs.environment == 'production'
    environment: production
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: production
      fly_app: instaclean-mithril
      fly_config: fly.toml
      fly_org: personal
      fly_mpg_name: instaclean-mithril-pg
      ready_url: https://api.tryinstaclean.com/ready
      openapi_url: https://api.tryinstaclean.com/openapi.json
      checkout_ref: ${{ github.sha }}
      confirm_ci: true
      apply_auth_schema: false
    secrets: inherit
