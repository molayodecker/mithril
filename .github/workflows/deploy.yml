name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options:
          - staging
          - production
        default: staging
      commit_sha:
        description: Exact main commit SHA to deploy. Required for production; optional for staging.
        required: false
        type: string

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  staging_after_ci:
    # Every successful CI run for a push to main deploys that exact commit
    # to staging. Pull-request CI never deploys.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: staging
      fly_app: instaclean-mithril-staging
      fly_config: fly.staging.toml
      ready_url: https://instaclean-mithril-staging.fly.dev/ready
      openapi_url: https://instaclean-mithril-staging.fly.dev/openapi.json
      checkout_ref: ${{ github.event.workflow_run.head_sha }}
      confirm_ci: false
      require_staging_status: false
      mark_staging_status: true
      apply_auth_schema: true
    secrets: inherit

  staging_manual:
    # Manual staging deploys are allowed from main. If commit_sha is omitted,
    # deploy the main commit from which the workflow was dispatched.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.environment == 'staging'
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: staging
      fly_app: instaclean-mithril-staging
      fly_config: fly.staging.toml
      ready_url: https://instaclean-mithril-staging.fly.dev/ready
      openapi_url: https://instaclean-mithril-staging.fly.dev/openapi.json
      checkout_ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}
      confirm_ci: true
      require_staging_status: false
      mark_staging_status: true
      apply_auth_schema: true
    secrets: inherit

  tag_staging:
    if: >-
      always()
      && (needs.staging_after_ci.result == 'success'
      || needs.staging_manual.result == 'success')
    needs:
      - staging_after_ci
      - staging_manual
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEPLOY_SHA: ${{ needs.staging_after_ci.outputs.deploy_sha || needs.staging_manual.outputs.deploy_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create or verify staging deployment tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Reusable staging deploy did not return a valid commit SHA."
            exit 1
          fi

          tag="staging/$DEPLOY_SHA"
          ref="refs/tags/$tag"
          api_ref="tags/staging/$DEPLOY_SHA"

          verify_existing_tag() {
            local existing existing_sha
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/$api_ref")"
            existing_sha="$(printf '%s' "$existing" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"

            if [[ "$existing_sha" != "$DEPLOY_SHA" ]]; then
              echo "::error::Tag $tag points to $existing_sha, expected $DEPLOY_SHA."
              return 1
            fi

            echo "Verified existing tag $tag -> $DEPLOY_SHA"
          }

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$api_ref" >/dev/null 2>&1; then
            verify_existing_tag
            exit 0
          fi

          if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="$ref" \
            -f sha="$DEPLOY_SHA"; then
            echo "Created tag $tag"
            exit 0
          fi

          echo "Tag creation raced or the ref already exists; verifying its target."
          verify_existing_tag

  production:
    # Production is an explicit promotion. The operator must supply the exact
    # main commit SHA that already deployed successfully to staging.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.environment == 'production'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: production
      fly_app: instaclean-mithril
      fly_config: fly.toml
      ready_url: https://api.tryinstaclean.com/ready
      openapi_url: https://api.tryinstaclean.com/openapi.json
      checkout_ref: ${{ inputs.commit_sha }}
      confirm_ci: true
      require_staging_status: true
      mark_staging_status: false
      apply_auth_schema: false
    secrets: inherit
