name: Fix replacement binding

on:
  push:
    branches: [fix/direct-dispatch-availability]
    paths:
      - scripts/fix_replacement_request_binding.py
      - .github/workflows/fix-replacement-binding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-dispatch-availability
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.6"
          elixir-version: "1.20.0"
      - run: mix deps.get
      - run: python scripts/fix_replacement_request_binding.py
      - run: mix format lib/mithril/direct_dispatch_safety.ex
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mithril/direct_dispatch_safety.ex
          git commit -m "Fix replacement handoff request binding"
          git push origin HEAD:fix/direct-dispatch-availability
