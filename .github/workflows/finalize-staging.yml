name: Finalize staging deployment

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string

permissions:
  contents: write
  statuses: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Validate SHA
        env:
          DEPLOY_SHA: ${{ inputs.checkout_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Expected a full commit SHA"; exit 1; }
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"

      - name: Create or verify staging deployment tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid deployment commit SHA."
            exit 1
          fi

          tag="staging/$DEPLOY_SHA"
          ref="refs/tags/$tag"
          api_ref="tags/staging/$DEPLOY_SHA"

          verify_existing_tag() {
            local existing existing_sha existing_type
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/$api_ref")"
            read -r existing_sha existing_type < <(
              printf '%s' "$existing" |
                python3 -c 'import json,sys; o=json.load(sys.stdin)["object"]; print(o["sha"], o["type"])'
            )
            if [[ "$existing_sha" != "$DEPLOY_SHA" || "$existing_type" != "commit" ]]; then
              echo "::error::Tag $tag points to $existing_type $existing_sha, expected commit $DEPLOY_SHA."
              return 1
            fi
            echo "Verified tag $tag -> $DEPLOY_SHA"
          }

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$api_ref" >/dev/null 2>&1; then
            verify_existing_tag
          elif gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="$ref" -f sha="$DEPLOY_SHA"; then
            echo "Created tag $tag"
          else
            echo "Tag creation failed or raced; checking for the expected ref."
            verify_existing_tag
          fi

      - name: Mark staging deployment successful
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
            -f state=success \
            -f context=mithril/staging \
            -f description="Mithril staging deployed and verified"


      - name: Mark failed staging finalization
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.checkout_ref }}
        shell: bash
        run: |
          if [[ "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
              -f state=failure -f context=mithril/staging \
              -f description="Mithril staging finalization failed"
          fi
