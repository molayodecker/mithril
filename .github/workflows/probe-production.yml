name: Probe Mithril production

on:
  push:
    branches: [fix/direct-dispatch-availability]
    paths: [.github/workflows/probe-production.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TARGET_DATABASE_URL: ${{ secrets.TARGET_DATABASE_URL }}
      MITHRIL_DATABASE_URL: ${{ secrets.MITHRIL_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check production readiness
        run: curl --fail --show-error --silent --max-time 20 https://api.tryinstaclean.com/ready
      - name: Check production OpenAPI contract
        run: |
          curl --fail --show-error --silent --max-time 20 https://api.tryinstaclean.com/openapi.json -o /tmp/openapi.json
          python3 - <<'PY'
          import json
          with open('/tmp/openapi.json') as f:
              spec = json.load(f)
          schema = spec['components']['schemas']['DirectAdminAssignServiceRequestRequest']
          props = schema.get('properties', {})
          print('DirectAdminAssignServiceRequestRequest properties:', sorted(props))
          if 'neededBy' not in props:
              raise SystemExit('Production OpenAPI is still missing neededBy')
          print('Production OpenAPI includes neededBy')
          PY
      - name: Check deploy secret availability
        shell: bash
        run: |
          for name in FLY_API_TOKEN TARGET_DATABASE_URL MITHRIL_DATABASE_URL DATABASE_URL; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=present"
            else
              echo "$name=missing"
            fi
          done
