name: Fix replacement timestamp assertion

on:
  push:
    branches: [fix/direct-dispatch-availability]
    paths:
      - .github/workflows/fix-replacement-test-precision.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-dispatch-availability
      - name: Fix timestamp precision assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/mithril/direct_dispatch_safety_test.exs')
          s = p.read_text()
          old = '    assert requested_start_at == ~U[2026-09-08 12:00:00Z]\n'
          new = '    assert DateTime.compare(requested_start_at, ~U[2026-09-08 12:00:00Z]) == :eq\n'
          if old not in s:
              raise SystemExit('timestamp assertion target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/mithril/direct_dispatch_safety_test.exs
          git commit -m "Fix replacement timestamp assertion"
          git push origin HEAD:fix/direct-dispatch-availability
