name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mithril_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/mithril_test

    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Exercise production shadow sync workflow
        run: bash scripts/test_db_sync.sh
      - name: Exercise Direct worker schedule reservations
        run: bash scripts/test_direct_schedule_reservations.sh

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.6"
          elixir-version: "1.20.0"

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - name: Verify dependency lock is reproducible
        run: git diff --exit-code -- mix.lock
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - name: Export OpenAPI contract
        run: |
          PHX_SERVER=true mix phx.server >/tmp/mithril-phx.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4002/openapi.json -o mithril-openapi.json; then
              break
            fi
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              cat /tmp/mithril-phx.log >&2
              exit 1
            fi
            sleep 1
          done
          test -s mithril-openapi.json || { cat /tmp/mithril-phx.log >&2; exit 1; }
          kill "$server_pid" >/dev/null 2>&1 || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: mithril-openapi
          path: mithril-openapi.json
          if-no-files-found: error
          retention-days: 7
      - run: mix test

  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t mithril:ci .
