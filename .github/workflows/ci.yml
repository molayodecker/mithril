name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mithril_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/mithril_test

    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.6"
          elixir-version: "1.20.0"

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - name: Verify dependency lock is reproducible
        run: git diff --exit-code -- mix.lock
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t mithril:ci .
