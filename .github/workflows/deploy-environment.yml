name: Deploy environment

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      fly_app:
        required: true
        type: string
      fly_config:
        required: true
        type: string
      fly_org:
        required: true
        type: string
      fly_mpg_name:
        required: true
        type: string
      ready_url:
        required: true
        type: string
      openapi_url:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string
      confirm_ci:
        required: false
        type: boolean
        default: false
      apply_auth_schema:
        required: false
        type: boolean
        default: false

concurrency:
  group: mithril-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    env:
      FLY_APP: ${{ inputs.fly_app }}
      FLY_ORG: ${{ inputs.fly_org }}
      FLY_MPG_NAME: ${{ inputs.fly_mpg_name }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TARGET_DATABASE_URL: ${{ secrets.TARGET_DATABASE_URL }}

    steps:
      - name: Check required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in FLY_API_TOKEN TARGET_DATABASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in the GitHub ${{ inputs.environment_name }} environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Confirm CI passed for this commit
        if: ${{ inputs.confirm_ci }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Manual deploy of $sha; requiring a successful push CI run for this commit."
          gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --commit "$sha" \
            --json conclusion,status,databaseId,event --limit 10 \
            | python3 -c '
          import json, sys
          runs = json.load(sys.stdin)
          if not any(
              run.get("conclusion") == "success" and run.get("event") == "push"
              for run in runs
          ):
              raise SystemExit("No successful push CI run found for this commit. Refusing to deploy.")
          '

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Proxy Fly Managed Postgres
        run: |
          set -euo pipefail
          cluster_id="$(
            fly mpg list --org "$FLY_ORG" --json | python3 -c '
          import json, sys
          target = sys.argv[1]
          data = json.load(sys.stdin)

          def find(value):
              if isinstance(value, dict):
                  name = value.get("name") or value.get("Name")
                  ident = value.get("id") or value.get("ID")
                  if name == target and ident:
                      print(ident)
                      return True
                  return any(find(child) for child in value.values())
              if isinstance(value, list):
                  return any(find(child) for child in value)
              return False

          if not find(data):
              raise SystemExit(f"Managed Postgres cluster {target!r} was not found")
          ' "$FLY_MPG_NAME"
          )"
          echo "Proxying $FLY_MPG_NAME to 127.0.0.1:16380"
          fly mpg proxy "$cluster_id" --bind-addr 127.0.0.1 --local-port 16380 >/tmp/mpg-proxy.log 2>&1 &
          echo $! > /tmp/mpg-proxy.pid
          for attempt in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/16380) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/mpg-proxy.pid)" >/dev/null 2>&1; then
              cat /tmp/mpg-proxy.log >&2
              exit 1
            fi
            sleep 1
          done
          cat /tmp/mpg-proxy.log >&2
          exit 1

      - name: Apply auth schema
        if: ${{ inputs.apply_auth_schema }}
        env:
          CONFIRM_AUTH_SCHEMA: "YES"
        run: bash scripts/apply_auth_schema.sh

      - name: Apply Direct schema phases
        env:
          CONFIRM_DIRECT_SCHEMA: "YES"
        run: bash scripts/apply_direct_schema.sh

      - name: Deploy Mithril to Fly
        run: flyctl deploy --remote-only --wait-timeout 180 --app "$FLY_APP" --config "${{ inputs.fly_config }}"

      - name: Verify readiness
        env:
          READY_URL: ${{ inputs.ready_url }}
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors \
            "$READY_URL" | tee /tmp/ready.json
          python3 - <<'PY'
          import json
          with open('/tmp/ready.json') as f:
              payload = json.load(f)
          if payload.get('status') != 'ready' or payload.get('database') != 'ok':
              raise SystemExit(f"Unexpected readiness response: {payload}")
          PY

      - name: Verify OpenAPI
        env:
          OPENAPI_URL: ${{ inputs.openapi_url }}
        run: |
          curl --fail --show-error --silent --retry 6 --retry-delay 3 --retry-all-errors \
            "$OPENAPI_URL" -o /tmp/openapi.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/openapi.json') as f:
              spec = json.load(f)
          if not spec.get('paths'):
              raise SystemExit('OpenAPI has no paths')
          print(f"Verified {len(spec['paths'])} API paths at {os.environ['OPENAPI_URL']}")
          PY
