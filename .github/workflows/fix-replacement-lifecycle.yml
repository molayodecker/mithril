name: Fix replacement lifecycle

on:
  push:
    branches: [fix/direct-dispatch-availability]
    paths:
      - scripts/apply_replacement_lifecycle_patch.py
      - .github/workflows/fix-replacement-lifecycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-dispatch-availability
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.6"
          elixir-version: "1.20.0"
      - run: mix deps.get
      - name: Apply lifecycle fixes
        run: python scripts/apply_replacement_lifecycle_patch.py
      - name: Format changed Elixir
        run: mix format lib/mithril/direct_dispatch.ex lib/mithril/direct_dispatch_safety.ex lib/mithril_web/schemas/direct_dispatch.ex lib/mithril_web/controllers/direct_dispatch_controller.ex test/mithril/direct_dispatch_safety_test.exs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mithril/direct_dispatch.ex lib/mithril/direct_dispatch_safety.ex lib/mithril_web/schemas/direct_dispatch.ex lib/mithril_web/controllers/direct_dispatch_controller.ex test/mithril/direct_dispatch_safety_test.exs
          git commit -m "Harden replacement lifecycle and timing"
          git push origin HEAD:fix/direct-dispatch-availability
